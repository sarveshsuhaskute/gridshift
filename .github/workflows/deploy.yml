name: deploy

# Manual on purpose: a deploy creates billable resources in several regions.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: cdk deploy
        run: npx -y aws-cdk@2 deploy --all --require-approval never
