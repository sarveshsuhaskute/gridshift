name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q
      - name: cdk synth (no credentials needed)
        run: npx -y aws-cdk@2 synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
