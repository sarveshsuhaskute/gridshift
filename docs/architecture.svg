<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #1f2328; font-weight: 600; }
      .s { font-size: 11px; fill: #57606a; }
      .h { font-size: 13px; fill: #57606a; font-weight: 600; }
      .box { fill: #ffffff; stroke-width: 1.5; }
      .compute { stroke: #ed7100; }
      .data { stroke: #3b48cc; }
      .flow { stroke: #e7157b; }
      .ops { stroke: #1a7f37; }
      .ext { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 5 4; stroke-width: 1.5; }
      .line { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .dispatch { stroke: #0969da; stroke-width: 2; fill: none; }
      .events { stroke: #bc4c00; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1100" height="640" rx="12" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1f2328">GridShift: carbon-aware multi-region batch scheduling</text>

  <!-- Client and external API -->
  <rect x="20" y="270" width="120" height="60" rx="8" class="ext"/>
  <text x="80" y="296" text-anchor="middle" class="t">Client</text>
  <text x="80" y="313" text-anchor="middle" class="s">SigV4-signed</text>

  <rect x="330" y="60" width="200" height="44" rx="8" class="ext"/>
  <text x="430" y="80" text-anchor="middle" class="t">Electricity Maps API</text>
  <text x="430" y="95" text-anchor="middle" class="s">grid carbon forecasts</text>

  <!-- Control plane -->
  <rect x="160" y="130" width="560" height="490" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="176" y="152" class="h">Control plane · home region (us-east-1)</text>

  <rect x="180" y="270" width="130" height="60" rx="8" class="box flow"/>
  <text x="245" y="295" text-anchor="middle" class="t">API Gateway</text>
  <text x="245" y="312" text-anchor="middle" class="s">HTTP API · IAM auth</text>

  <rect x="180" y="370" width="130" height="50" rx="8" class="box compute"/>
  <text x="245" y="400" text-anchor="middle" class="t">submit / get λ</text>

  <rect x="180" y="470" width="130" height="60" rx="8" class="box data"/>
  <text x="245" y="495" text-anchor="middle" class="t">DynamoDB</text>
  <text x="245" y="512" text-anchor="middle" class="s">jobs · forecasts</text>

  <rect x="330" y="170" width="200" height="50" rx="8" class="box compute"/>
  <text x="430" y="191" text-anchor="middle" class="t">ingest_forecasts λ</text>
  <text x="430" y="208" text-anchor="middle" class="s">scheduled every 30 min</text>

  <rect x="570" y="165" width="130" height="55" rx="8" class="box ops"/>
  <text x="635" y="188" text-anchor="middle" class="t">SNS · CloudWatch</text>
  <text x="635" y="205" text-anchor="middle" class="s">alerts · metrics · alarms</text>

  <!-- Step Functions -->
  <rect x="340" y="250" width="210" height="310" rx="8" fill="#ffffff" stroke="#e7157b" stroke-width="1.5"/>
  <text x="352" y="272" class="h">Step Functions (per job)</text>
  <rect x="360" y="285" width="170" height="40" rx="6" fill="#fff8f2" stroke="#ed7100"/>
  <text x="445" y="302" text-anchor="middle" class="t">Plan λ</text>
  <text x="445" y="317" text-anchor="middle" class="s">region × time slot scoring</text>
  <rect x="360" y="340" width="170" height="40" rx="6" fill="#fdf2f8" stroke="#e7157b"/>
  <text x="445" y="357" text-anchor="middle" class="t">Wait</text>
  <text x="445" y="372" text-anchor="middle" class="s">until the cleanest slot</text>
  <rect x="360" y="395" width="170" height="40" rx="6" fill="#fff8f2" stroke="#ed7100"/>
  <text x="445" y="412" text-anchor="middle" class="t">Run on Fargate Spot</text>
  <text x="445" y="427" text-anchor="middle" class="s">waitForTaskToken</text>
  <rect x="360" y="450" width="170" height="40" rx="6" fill="#fff8f2" stroke="#ed7100"/>
  <text x="445" y="467" text-anchor="middle" class="t">Fallback: on-demand</text>
  <text x="445" y="482" text-anchor="middle" class="s">on Spot failure, other region</text>
  <rect x="360" y="505" width="170" height="40" rx="6" fill="#fff8f2" stroke="#ed7100"/>
  <text x="445" y="522" text-anchor="middle" class="t">Finalize λ</text>
  <text x="445" y="537" text-anchor="middle" class="s">measured CO₂ · notify</text>
  <path d="M445 325 V338" class="line" marker-end="url(#arrow)"/>
  <path d="M445 380 V393" class="line" marker-end="url(#arrow)"/>
  <path d="M445 435 V448" class="line" marker-end="url(#arrow)"/>
  <path d="M445 490 V503" class="line" marker-end="url(#arrow)"/>

  <rect x="570" y="470" width="130" height="50" rx="8" class="box compute"/>
  <text x="635" y="491" text-anchor="middle" class="t">complete_job λ</text>
  <text x="635" y="508" text-anchor="middle" class="s">idempotent</text>

  <rect x="570" y="545" width="130" height="55" rx="8" class="box flow"/>
  <text x="635" y="568" text-anchor="middle" class="t">EventBridge</text>
  <text x="635" y="585" text-anchor="middle" class="s">default bus</text>

  <!-- Worker regions -->
  <g>
    <rect x="780" y="130" width="300" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="796" y="152" class="h">Worker · eu-north-1 (Stockholm)</text>
    <rect x="795" y="165" width="130" height="50" rx="8" class="box compute"/>
    <text x="860" y="186" text-anchor="middle" class="t">ECS Fargate</text>
    <text x="860" y="203" text-anchor="middle" class="s">Spot + on-demand</text>
    <rect x="935" y="165" width="130" height="50" rx="8" class="box data"/>
    <text x="1000" y="195" text-anchor="middle" class="t">S3 outputs</text>
    <text x="796" y="250" class="s">VPC (2 AZ) · SSM discovery · event rule</text>
  </g>
  <g>
    <rect x="780" y="285" width="300" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="796" y="307" class="h">Worker · ca-central-1 (Montréal)</text>
    <rect x="795" y="320" width="130" height="50" rx="8" class="box compute"/>
    <text x="860" y="341" text-anchor="middle" class="t">ECS Fargate</text>
    <text x="860" y="358" text-anchor="middle" class="s">Spot + on-demand</text>
    <rect x="935" y="320" width="130" height="50" rx="8" class="box data"/>
    <text x="1000" y="350" text-anchor="middle" class="t">S3 outputs</text>
    <text x="796" y="405" class="s">VPC (2 AZ) · SSM discovery · event rule</text>
  </g>
  <g>
    <rect x="780" y="440" width="300" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="796" y="462" class="h">Worker · us-east-1 (N. Virginia)</text>
    <rect x="795" y="475" width="130" height="50" rx="8" class="box compute"/>
    <text x="860" y="496" text-anchor="middle" class="t">ECS Fargate</text>
    <text x="860" y="513" text-anchor="middle" class="s">Spot + on-demand</text>
    <rect x="935" y="475" width="130" height="50" rx="8" class="box data"/>
    <text x="1000" y="505" text-anchor="middle" class="t">S3 outputs</text>
    <text x="796" y="560" class="s">VPC (2 AZ) · SSM discovery</text>
  </g>

  <!-- Request path -->
  <path d="M140 300 H178" class="line" marker-end="url(#arrow)"/>
  <path d="M245 330 V368" class="line" marker-end="url(#arrow)"/>
  <path d="M245 420 V468" class="line" marker-end="url(#arrow)"/>
  <path d="M310 395 H338" class="line" marker-end="url(#arrow)"/>
  <text x="314" y="389" class="s">start</text>
  <path d="M430 104 V168" class="line" marker-end="url(#arrow)"/>
  <path d="M330 195 H168 V500 H178" class="line" marker-end="url(#arrow)"/>

  <!-- Dispatch: RunTask in the chosen region -->
  <path d="M530 415 H740" class="dispatch"/>
  <path d="M740 190 V490" class="dispatch"/>
  <path d="M740 190 H778" class="dispatch" marker-end="url(#arrow-blue)"/>
  <path d="M740 345 H778" class="dispatch" marker-end="url(#arrow-blue)"/>
  <path d="M740 490 H778" class="dispatch" marker-end="url(#arrow-blue)"/>
  <text x="560" y="408" font-size="11" fill="#0969da" font-weight="600">ecs:RunTask</text>

  <!-- Completion: cross-region task-stopped events -->
  <path d="M780 240 H760 V595" class="events"/>
  <path d="M780 395 H760" class="events"/>
  <path d="M780 545 H760" class="events"/>
  <path d="M760 595 H702" class="events" marker-end="url(#arrow-orange)"/>
  <text x="706" y="616" font-size="11" fill="#bc4c00" font-weight="600">task STOPPED (cross-region)</text>
  <path d="M635 545 V522" class="line" marker-end="url(#arrow)"/>
  <path d="M570 495 H552" class="line" marker-end="url(#arrow)"/>
  <text x="572" y="462" class="s">SendTaskSuccess</text>
</svg>
